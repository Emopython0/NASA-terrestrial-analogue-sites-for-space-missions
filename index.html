<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planetary Analog Matcher | NASA Space Apps Challenge</title>
    <!-- Chart.js loaded directly from CDN so GitHub Pages runs it instantly without installations -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: #111827;
            --border-color: #1f2937;
            --cyan: #00f2fe;
            --amber: #f59e0b;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            text-align: center;
            max-width: 850px;
            margin-bottom: 28px;
        }
        .header h1 {
            margin: 0 0 8px 0;
            font-size: 2rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: linear-gradient(90deg, var(--cyan), #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header p {
            color: var(--text-muted);
            margin: 0;
            font-size: 1rem;
        }
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 24px;
            max-width: 1000px;
            width: 100%;
        }
        @media (max-width: 768px) {
            .dashboard { grid-template-columns: 1fr; }
        }
        .panel {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }
        .control-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 700;
        }
        select {
            width: 100%;
            padding: 12px;
            background-color: #1f2937;
            color: white;
            border: 1px solid #374151;
            border-radius: 8px;
            font-size: 0.95rem;
            cursor: pointer;
        }
        select:focus {
            outline: none;
            border-color: var(--cyan);
        }
        .score-box {
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.08), rgba(245, 158, 11, 0.08));
            border: 1px solid rgba(0, 242, 254, 0.25);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            margin-top: 24px;
        }
        .score-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1px;
        }
        .score-value {
            font-size: 3.2rem;
            font-weight: 800;
            color: var(--cyan);
            margin: 4px 0;
        }
        .mission-note {
            font-size: 0.9rem;
            color: #d1d5db;
            line-height: 1.5;
            margin-top: 18px;
            padding-top: 18px;
            border-top: 1px solid var(--border-color);
        }
        .chart-container {
            position: relative;
            height: 400px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Planetary Analog Matcher</h1>
        <p>Quantitative Terrain, Mineral & Thermal Comparison: Earth Testbeds vs. Lunar Targets</p>
    </div>

    <div class="dashboard">
        <!-- Control Panel: Easily editable for your research -->
        <div class="panel">
            <div class="control-group">
                <label for="earthSelect" style="color: #00f2fe;">1. Select Earth Analog Site</label>
                <select id="earthSelect" onchange="updateComparison()"></select>
            </div>

            <div class="control-group">
                <label for="moonSelect" style="color: #f59e0b;">2. Select Lunar Target Location</label>
                <select id="moonSelect" onchange="updateComparison()"></select>
            </div>

            <div class="score-box">
                <div class="score-label">Geological & Terrain Similarity</div>
                <div class="score-value" id="similarityScore">--%</div>
                <div style="font-size: 0.75rem; color: #9ca3af;">Normalized Euclidean Vector Algorithm</div>
            </div>

            <div class="mission-note" id="missionInsight"></div>
        </div>

        <!-- Radar Chart Panel -->
        <div class="panel">
            <div class="chart-container">
                <canvas id="radarChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        /* 
          ========================================================================
          RESEARCH DATA STORAGE 
          You can easily modify numbers or add new locations here as your research grows!
          Normalized values ('norm') must be between 0.0 and 1.0 for the chart scale.
          ========================================================================
        */

        const earthSites = {
            "UAE Rub' al Khali (Desert Dunes)": {
                norm: [0.00, 0.01, 0.00, 0.00, 0.03],
                note: "Fine wind-blown silica dunes simulate loose lunar regolith mechanics for testing rover wheel traction, sinkage, and dust-mitigation seals."
            },
            "Hajar Mountains (Ophiolite / Anorthosite)": {
                norm: [1.00, 1.00, 0.80, 0.23, 0.01],
                note: "High plagioclase/anorthosite rock content closely mirrors ancient Lunar Highlands crust, ideal for ISRU oxygen extraction research."
            },
            "Harrat Khaybar Volcanic Field (Lava Tubes)": {
                norm: [0.32, 0.33, 0.04, 1.00, 0.00],
                note: "Basaltic volcanic fields and subterranean lava tubes replicate lunar sinuous rilles and skylight pits for testing autonomous mapping drones."
            },
            "Antarctic Dry Valleys": {
                norm: [0.45, 0.08, 0.11, 0.41, 0.07],
                note: "Hyper-arid permafrost and low-angle solar illumination replicate cryogenic South Pole craters for testing ice-mining drills."
            }
        };

        const moonSites = {
            "Moon: Shackleton Crater (South Pole)": {
                norm: [0.57, 0.00, 0.90, 0.14, 0.53],
                note: "Artemis target zone featuring peaks of near-eternal sunlight on the rim and permanently shadowed water-ice traps inside."
            },
            "Moon: Marius Hills (Subterranean Pit)": {
                norm: [0.30, 0.00, 0.26, 0.82, 1.00],
                note: "Volcanic dome region containing a confirmed skylight pit leading into an intact underground lava tube with stable internal temperatures."
            },
            "Moon: Lunar Highlands (Tycho Region)": {
                norm: [0.87, 0.00, 1.00, 0.07, 0.96],
                note: "Rugged, heavily cratered terrain composed primarily of bright calcium-rich anorthosite rock."
            }
        };

        const features = [
            "Terrain Slope",
            "Grain Size",
            "Anorthosite Mineral %",
            "Basalt Rock %",
            "Thermal Swing"
        ];

        // Populate HTML Dropdown Menus automatically
        const earthSelect = document.getElementById("earthSelect");
        const moonSelect = document.getElementById("moonSelect");

        Object.keys(earthSites).forEach(site => {
            const opt = document.createElement("option");
            opt.value = site;
            opt.textContent = site;
            earthSelect.appendChild(opt);
        });

        Object.keys(moonSites).forEach(site => {
            const opt = document.createElement("option");
            opt.value = site;
            opt.textContent = site;
            moonSelect.appendChild(opt);
        });

        // Default Selections
        earthSelect.value = "Hajar Mountains (Ophiolite / Anorthosite)";
        moonSelect.value = "Moon: Lunar Highlands (Tycho Region)";

        // Initialize Chart.js Radar Visualization
        const ctx = document.getElementById("radarChart").getContext("2d");
        const radarChart = new Chart(ctx, {
            type: "radar",
            data: {
                labels: features,
                datasets: [
                    {
                        label: "Earth Analog",
                        data: [],
                        backgroundColor: "rgba(0, 242, 254, 0.2)",
                        borderColor: "#00f2fe",
                        pointBackgroundColor: "#00f2fe",
                        borderWidth: 2
                    },
                    {
                        label: "Lunar Target",
                        data: [],
                        backgroundColor: "rgba(245, 158, 11, 0.2)",
                        borderColor: "#f59e0b",
                        pointBackgroundColor: "#f59e0b",
                        borderDash: [5, 5],
                        borderWidth: 2
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    r: {
                        min: 0,
                        max: 1,
                        ticks: { display: false },
                        grid: { color: "#1f2937" },
                        angleLines: { color: "#374151" },
                        pointLabels: {
                            color: "#e5e7eb",
                            font: { size: 11, weight: "bold" }
                        }
                    }
                },
                plugins: {
                    legend: {
                        labels: { color: "#f3f4f6", font: { size: 12 } }
                    }
                }
            }
        });

        // Math Logic: Euclidean Similarity Calculation & UI Refresh
        function updateComparison() {
            const eName = earthSelect.value;
            const mName = moonSelect.value;

            const eData = earthSites[eName];
            const mData = moonSites[mName];

            let sumSq = 0;
            for (let i = 0; i < eData.norm.length; i++) {
                sumSq += Math.pow(eData.norm[i] - mData.norm[i], 2);
            }
            const distance = Math.sqrt(sumSq);
            const maxDist = Math.sqrt(eData.norm.length);
            const similarity = ((1 - (distance / maxDist)) * 100).toFixed(1);

            document.getElementById("similarityScore").textContent = similarity + "%";
            document.getElementById("missionInsight").innerHTML = 
                `<strong>Earth Testbed Value:</strong> ${eData.note}<br><br>` +
                `<strong>Lunar Objective:</strong> ${mData.note}`;

            radarChart.data.datasets[0].label = eName;
            radarChart.data.datasets[0].data = eData.norm;
            radarChart.data.datasets[1].label = mName;
            radarChart.data.datasets[1].data = mData.norm;
            radarChart.update();
        }

        // Run on page load
        updateComparison();
    </script>
</body>
</html>
